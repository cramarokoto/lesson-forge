public: élèves de seconde générale et technologique (15-16 ans), en France
langue: fr
referentiel:
  nom: Programme de physique-chimie de seconde générale et technologique
  reference: BO spécial n°1 du 22 janvier 2019   # le cadreur retrouve et ouvre le texte officiel
